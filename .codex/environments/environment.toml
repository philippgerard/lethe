version = 1
name = "Lethe"

[setup]
script = '''
set -eu

rustc --version
cargo --version
cargo fetch --locked
'''

[[actions]]
name = "Check formatting"
icon = "test"
command = "cargo fmt --check"

[[actions]]
name = "Run Lethe tests"
icon = "test"
command = "LETHE_HOME=\"$PWD/target/codex-home\" cargo test --locked"

[[actions]]
name = "Build Lethe release"
icon = "tool"
command = "LETHE_HOME=\"$PWD/target/codex-home\" cargo build --release --locked --bin lethe"

[[actions]]
name = "Test migrator"
icon = "test"
command = "command -v protoc >/dev/null || { echo 'protoc is required for the migrator' >&2; exit 1; }; cargo test --locked --manifest-path migrator/Cargo.toml"

[[actions]]
name = "Test vendored genai"
icon = "test"
command = "cargo test --locked --manifest-path vendor/genai/Cargo.toml"
