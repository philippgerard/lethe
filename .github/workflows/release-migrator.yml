name: Release migrator

# `lethe-migrate` is a one-shot legacy tool (migrates v0.18 LanceDB storage to
# the current SQLite-vec storage). It pulls LanceDB + Arrow + DataFusion — by
# far the heaviest compile in the repo — and it almost never changes. So it is
# decoupled from the main release: it builds only when its own `migrator-v*`
# tag is pushed, or when triggered by hand. Normal `v*` lethe releases skip it
# entirely (which is most of why they were slow).
on:
  push:
    tags:
      - "migrator-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build migrator ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deps: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config mold
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deps: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config mold
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            deps: brew install protobuf

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce release security policy
        run: bash scripts/test-release-security

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: migrator
          cache-on-failure: "true"

      - name: Install native dependencies
        run: ${{ matrix.deps }}

      - name: Build lethe-migrate
        run: cargo build --release --locked --manifest-path migrator/Cargo.toml

      - name: Package lethe-migrate
        env:
          LETHE_RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/package-migrator

      - name: Attest migrator release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lethe-migrate-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish migrator release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-migrator.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
