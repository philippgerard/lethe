name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Incremental compilation only helps repeated local builds; in CI it just
# bloats the cache. Turning it off keeps the rust-cache small enough to avoid
# eviction (which is what forces cold rebuilds).
env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Install mold
        run: curl -fsSL https://github.com/rui314/mold/releases/download/v2.41.0/mold-2.41.0-x86_64-linux.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          cache-on-failure: "true"

      - name: Check formatting
        run: cargo fmt --check

      - name: Check release scripts
        run: >-
          bash -n install.sh update.sh scripts/package-release
          scripts/test-binary-attestation scripts/test-release-security
          scripts/tests/security-policy-regression.sh

      - name: Test release security policy
        run: bash scripts/test-release-security

      - name: Test binary attestation behavior
        run: bash scripts/test-binary-attestation

      - name: Test shell security policy
        run: bash scripts/tests/security-policy-regression.sh

      - name: Test Lethe
        env:
          LETHE_HOME: ${{ runner.temp }}/lethe-home
        run: cargo test --locked --no-default-features

      - name: Test vendored genai library
        run: cargo test --locked --manifest-path vendor/genai/Cargo.toml --lib

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu builds pin to ubuntu-24.04 (glibc 2.39) because the
          # prebuilt ort/onnxruntime binaries pulled in by fastembed require
          # `__isoc23_strtol*` symbols introduced in glibc 2.39. End-user
          # floor: Ubuntu 24.04+, Debian 13+, Fedora 40+, RHEL/Rocky 10+.
          # macOS binaries link only system libs and stay portable per arch.
          # The only native build dependency is the mold linker (required by
          # .cargo/config.toml on Linux). It is fetched as a static binary
          # from its GitHub releases instead of apt: the arm64 runners pull
          # from ports.ubuntu.com, whose outages have broken this workflow,
          # while GitHub-to-GitHub downloads share the runner's own
          # infrastructure. protobuf was a leftover — nothing in Cargo.lock
          # uses protoc since the LanceDB migrator moved to its own workflow.
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deps: curl -fsSL https://github.com/rui314/mold/releases/download/v2.41.0/mold-2.41.0-x86_64-linux.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deps: curl -fsSL https://github.com/rui314/mold/releases/download/v2.41.0/mold-2.41.0-aarch64-linux.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            deps: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce release security policy
        run: bash scripts/test-release-security

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Only the `lethe` workspace — the migrator (LanceDB/Arrow/DataFusion)
      # builds in its own workflow so its multi-GB target tree never evicts
      # this cache. See .github/workflows/release-migrator.yml.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          cache-on-failure: "true"
          cache-directories: |
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io

      - name: Install native dependencies
        run: ${{ matrix.deps }}

      # ort-sys stores its downloaded static library outside target/. A restored
      # Cargo build-script result can otherwise keep a stale -L path after that
      # external cache was evicted.
      - name: Refresh ONNX Runtime link metadata
        run: cargo clean -p ort-sys

      - name: Build lethe
        run: cargo build --release --locked --bin lethe

      - name: Package lethe
        env:
          LETHE_RELEASE_TARGET: ${{ matrix.target }}
        run: scripts/package-release

      - name: Attest release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lethe-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
